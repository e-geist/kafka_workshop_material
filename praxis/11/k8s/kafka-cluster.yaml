# Knoten des Kafka Clusters: 3 Knoten, die gleichzeitig Controller (KRaft) und Broker sind
apiVersion: kafka.strimzi.io/v1
kind: ? # Strimzi Ressource für eine Gruppe von Knoten mit gleichen Rollen und gleicher Konfiguration
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: ? # Zuordnung zum Kafka Cluster (Name der Kafka Ressource)
spec:
  replicas: ? # Anzahl Knoten
  roles: # beide Rollen von Kafka Knoten im KRaft Modus
    - ?
    - ?
  storage:
    type: ephemeral # Daten nur im Pod, gehen bei Neustart verloren (nur für lokale Tests)
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1Gi
---
# Kafka Cluster: Version, Listener und Broker Konfiguration
apiVersion: kafka.strimzi.io/v1
kind: ? # Strimzi Ressource für den Kafka Cluster
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: ? # Listener Typ: nur innerhalb des Kubernetes Clusters erreichbar
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {} # verwaltet KafkaTopic Ressourcen
    userOperator: {} # verwaltet KafkaUser Ressourcen
