# Bonus: Benutzer, der das Topic nur lesen darf
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: workshop-user
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512 # Passwort wird vom User Operator erzeugt und als Secret workshop-user abgelegt
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: workshop-topic
          patternType: literal
        operations:
          - Describe
          - Read
      - resource:
          type: group
          name: workshop-group
          patternType: literal
        operations:
          - Read
