# Technischer Benutzer consumer-user
# Authentifizierung per SASL, Verschlüsselung per TLS
security.protocol=?
# SCRAM mit SHA-512
sasl.mechanism=?
# Login Modul für SCRAM (Klasse ScramLoginModule im Package org.apache.kafka.common.security.scram)
sasl.jaas.config=? required username="consumer-user" password="consumer-secret";
ssl.truststore.type=PKCS12
# Truststore mit dem CA Zertifikat, im Container kafka unter /etc/kafka/secrets
ssl.truststore.location=?
ssl.truststore.password=changeit
