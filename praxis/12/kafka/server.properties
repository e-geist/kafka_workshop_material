# Einzelner Knoten als Broker und Controller
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
log.dirs=/tmp/kraft-combined-logs
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0

# Listener: SECURE für Clients und Broker, CONTROLLER nur für KRaft
listeners=SECURE://:9092,CONTROLLER://:9093
advertised.listeners=SECURE://kafka:9092
listener.security.protocol.map=SECURE:SASL_SSL,CONTROLLER:SSL
inter.broker.listener.name=SECURE
controller.listener.names=CONTROLLER

# TLS: Zertifikat des Brokers und vertrauenswürdige CA
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/kafka.keystore.p12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=changeit
ssl.enabled.protocols=TLSv1.3,TLSv1.2

# Controller Listener mit mTLS: Broker meldet sich mit seinem Zertifikat an, Principal aus dem CN ➡️ User:kafka
listener.name.controller.ssl.client.auth=required
ssl.principal.mapping.rules=RULE:^CN=([^,]*),.*$/$1/,DEFAULT

# SASL auf dem Listener SECURE: SCRAM (Benutzername + Passwort) und OAUTHBEARER (Token von Keycloak)
sasl.enabled.mechanisms=SCRAM-SHA-512,OAUTHBEARER
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.secure.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";

# OAUTHBEARER: Broker prüft Signatur der Tokens mit den öffentlichen Schlüsseln (JWKS) von Keycloak
listener.name.secure.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;
listener.name.secure.oauthbearer.sasl.server.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler
sasl.oauthbearer.jwks.endpoint.url=http://keycloak:8080/realms/workshop/protocol/openid-connect/certs
sasl.oauthbearer.expected.issuer=http://keycloak:8080/realms/workshop
sasl.oauthbearer.expected.audience=kafka
# Principal aus dem Claim azp (Client ID in Keycloak) ➡️ User:measurement-producer
sasl.oauthbearer.sub.claim.name=azp

# Autorisierung über ACLs, ohne passende ACL ist alles verboten
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:admin;User:kafka
