name: kafka_workshop_13
services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: /opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server kafka:19092 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:18-alpine
    hostname: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro # legt die Tabellen beim ersten Start an
    healthcheck:
      test: pg_isready -U workshop -d workshop
      interval: 5s
      timeout: 5s
      retries: 10

  # Part 1
  dual-write-producer:
    build: ./dual-write-producer
    pull_policy: build
    environment:
      FAIL_EVERY: 5 # jede 5. Messung schlägt nach dem Senden fehl
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Part 2 und 3
  outbox-producer:
    build: ./outbox-producer
    pull_policy: build
    environment:
      FAIL_EVERY: 5 # jede 5. Messung schlägt vor dem Commit fehl
      RELAY_CRASH_EVERY: 0 # Part 3: auf 4 setzen, Relay stürzt nach jedem 4. gesendeten Event ab
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Part 3
  consumer:
    build: ./consumer
    pull_policy: build
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
